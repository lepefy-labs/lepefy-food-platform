name: Nala semantic enrichment

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: nala-semantic-enrichment
  cancel-in-progress: false

jobs:
  enrich-pending-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Enrich pending Nala interactions
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NALA_ENRICHMENT_APP_URL: ${{ vars.NALA_ENRICHMENT_APP_URL }}
          EVENT_REPORTS_APP_URL: ${{ vars.EVENT_REPORTS_APP_URL }}
        run: node scripts/process-nala-semantic-enrichment.mjs
