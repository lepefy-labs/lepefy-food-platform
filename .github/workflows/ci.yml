        run: |
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/tests/107_tester_feedback_invites.fixture.sql
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/migrations/107_tester_feedback_invites.sql
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/tests/107_tester_feedback_invites.test.sql

      - name: Event gallery editorial migration and compatibility
        if: ${{ !cancelled() }}
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/tests/110_event_gallery_editorial.fixture.sql
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/migrations/110_event_gallery_editorial.sql
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/tests/110_event_gallery_editorial.test.sql

      - name: Managed shipping migration, historical preservation and tenant isolation
        if: ${{ !cancelled() }}
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/tests/111_managed_shipping_tracking.fixture.sql
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/migrations/111_managed_shipping_tracking.sql
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/tests/111_managed_shipping_tracking.test.sql

      - name: Category server write grants and customer read-only access
        if: ${{ !cancelled() }}
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/tests/112_category_service_writes.fixture.sql
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/migrations/112_category_service_writes.sql
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/migrations/112_category_service_writes.sql
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/tests/112_category_service_writes.test.sql

      - name: Verified reviews migration, moderation and isolation
        if: ${{ !cancelled() }}
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/tests/113_reviews_foundation.fixture.sql
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/migrations/113_reviews_foundation.sql
          psql -h localhost -U postgres -d ai_core_test -v ON_ERROR_STOP=1 -f supabase/tests/113_reviews_foundation.test.sql
