name: Shipping campaign worker
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shipping-campaign-worker
  cancel-in-progress: false
jobs:
  process-campaign-batch:
    # Transition sans interruption : tant que n8n n'est pas vérifié, garder
    # l'ancien cron. Après validation, régler la variable GitHub
    # SHIPPING_CAMPAIGN_N8N_ACTIVE=true ; workflow_dispatch reste disponible.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SHIPPING_CAMPAIGN_N8N_ACTIVE != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Process pending simulation campaign scenarios
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHIPPING_SYNC_APP_URL: ${{ vars.SHIPPING_SYNC_APP_URL }}
          AI_CORE_APP_URL: ${{ vars.AI_CORE_APP_URL }}
          NALA_ENRICHMENT_APP_URL: ${{ vars.NALA_ENRICHMENT_APP_URL }}
          EVENT_REPORTS_APP_URL: ${{ vars.EVENT_REPORTS_APP_URL }}
        run: node scripts/process-shipping-campaign-worker.mjs
