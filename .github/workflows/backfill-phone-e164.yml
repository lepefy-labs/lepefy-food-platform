name: Backfill Phone Numbers (E.164)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (nessuna scrittura su customers)'
        required: false
        default: true
        type: boolean

jobs:
  backfill-phone-e164:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install libphonenumber-js

      - name: Backfill customer phone numbers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/backfill-phone-e164.mjs
