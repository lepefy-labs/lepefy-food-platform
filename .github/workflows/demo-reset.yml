name: Demo reset (Demo Experience)

# Remise à zéro des démos (docs/DEMO_EXPERIENCE.md §6) : un nouveau tenant de
# démo est créé à partir du scénario, l'ancien est archivé. Chaque nuit, et à
# la demande. Refusée pendant une présentation (bail), sauf « force ».
# Base Supabase de la DÉMO uniquement : secrets de l'environnement GitHub
# « demo » (démo publique et démo privée : même base), jamais ceux de la production.

on:
  schedule:
    - cron: '0 2 * * *'   # 04:00 Paris en été, 03:00 en hiver
  workflow_dispatch:
    inputs:
      target:
        description: 'Démo visée (publique ou privée, même base et mêmes secrets : environnement GitHub « demo »)'
        required: true
        default: public
        type: choice
        options: [public, private]
      force:
        description: 'Forcer pendant une présentation en cours'
        required: false
        default: false
        type: boolean

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ github.event_name == 'schedule' && fromJSON('["public","private"]') || fromJSON(format('["{0}"]', github.event.inputs.target)) }}
    environment: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reset demo
        env:
          DEMO_SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
          DEMO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEMO_SUPABASE_SERVICE_ROLE_KEY }}
          DEMO_SUPABASE_PROJECT_REF: ${{ vars.DEMO_SUPABASE_PROJECT_REF }}
          TARGET: ${{ matrix.target }}
          PUBLIC_SLUG: ${{ vars.DEMO_TENANT_SLUG }}
          PUBLIC_SCENARIO: ${{ vars.DEMO_SCENARIO }}
          PUBLIC_ACCESS_MODE: ${{ vars.DEMO_ACCESS_MODE }}
          PUBLIC_APP_URL: ${{ vars.DEMO_APP_URL }}
          PRIVATE_SLUG: ${{ vars.DEMO_PRIVATE_TENANT_SLUG }}
          PRIVATE_SCENARIO: ${{ vars.DEMO_PRIVATE_SCENARIO }}
          PRIVATE_APP_URL: ${{ vars.DEMO_PRIVATE_APP_URL }}
          DEMO_INTERNAL_TOKEN: ${{ secrets.DEMO_INTERNAL_TOKEN }}
          DEMO_PRESENTER_EMAILS: ${{ vars.DEMO_PRESENTER_EMAILS }}
          DEMO_REQUESTED_BY: ${{ github.event_name == 'schedule' && 'Remise à zéro nocturne' || github.actor }}
          FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          # Démo privée : uniquement ses propres variables, jamais un repli sur la démo publique.
          if [ "$TARGET" = "private" ]; then
            export DEMO_TENANT_SLUG="$PRIVATE_SLUG" DEMO_SCENARIO="$PRIVATE_SCENARIO" DEMO_ACCESS_MODE=private DEMO_APP_URL="$PRIVATE_APP_URL"
          else
            export DEMO_TENANT_SLUG="$PUBLIC_SLUG" DEMO_SCENARIO="$PUBLIC_SCENARIO" DEMO_ACCESS_MODE="$PUBLIC_ACCESS_MODE" DEMO_APP_URL="$PUBLIC_APP_URL"
          fi
          if [ -z "$DEMO_SUPABASE_URL" ] || [ -z "$DEMO_TENANT_SLUG" ] || [ -z "$DEMO_SCENARIO" ]; then
            echo "::notice::Démo ${{ matrix.target }} non configurée : rien à faire."
            exit 0
          fi
          node scripts/demo/seed-demo.mjs --scenario "$DEMO_SCENARIO" --reset $FORCE
