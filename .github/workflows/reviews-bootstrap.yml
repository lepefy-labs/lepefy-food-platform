name: Reviews V1 staging bootstrap
on:
  push:
    branches: [automation/reviews-v1-stage]
    paths: [.github/workflows/reviews-bootstrap.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/reviews-v1-stage
      - name: Materialize approved Reviews V1 delivery
        shell: bash
        run: |
          cat .reviews-bootstrap/part-* > /tmp/reviews.b64
          base64 -d /tmp/reviews.b64 > /tmp/reviews.tar.gz
          tar -xzf /tmp/reviews.tar.gz -C .
          git checkout HEAD -- .github/workflows/ci.yml
          rm -f .github/workflows/review-invites.yml
      - name: Update current-state project context
        shell: python
        run: |
          from pathlib import Path
          p = Path('LEPEFY_PROJECT_CONTEXT.md')
          text = p.read_text()
          text = text.replace('**v6.55 Current-State Snapshot**', '**v6.56 Current-State Snapshot**', 1)
          if 'reviews.view' not in text:
              text = text.replace('growth.payouts.manage\nai_knowledge.manage', 'growth.payouts.manage\nreviews.view\nreviews.moderate\nreviews.manage\nai_knowledge.manage', 1)
          marker = '## 5. Profilo e onboarding admin'
          if '## 4.2 Avis clients vérifiés' not in text:
              text = text.replace(marker, "## 4.2 Avis clients vérifiés\n\nIl modulo Reviews V1 introduce recensioni complessive del servizio legate a una singola commande Shop verificata. Le surface canoniche sono `/avis` e `/avis/donner` lato storefront e `/admin/avis` lato tenant admin. L'accesso commerciale usa la feature `reviews` in `platform_features`/`platform_plan_features`; l'attivazione operativa e la configurazione tenant restano in `tenant_feature_settings`, separate dal billing. Le capability dedicate sono `reviews.view`, `reviews.moderate` e `reviews.manage`; i system role `platform_owner` e `tenant_admin` le ricevono dalla migration, mentre i custom role non vengono ampliati automaticamente.\n\nUna recensione V1 è sempre di tipo `service`, una sola per `(tenant_id, order_id, review_type)`, e può essere creata soltanto per un ordine dello stesso tenant con `status = delivered` e `payment_status = paid`. Il cliente autenticato deve coincidere con `orders.customer_id`; il percorso guest usa un token invito casuale 32-byte, persistito esclusivamente come SHA-256 e legato a tenant/ordine/invito. Il nome pubblico viene minimizzato (`Prénom I.`) e, in assenza di nome affidabile, usa `Client vérifié` senza derivare dati dall'e-mail.\n\nTutte le recensioni entrano obbligatoriamente in `pending_moderation`. Voto e testo cliente sono immutabili dopo l'invio; il tenant non può riscriverli. Le transizioni `publish | reject | hide | restore` passano dall'RPC `moderate_review`, che registra un audit append-only in `review_moderation_events`; reject/hide richiedono un reason code. Un voto basso non è mai un criterio di rifiuto. La blacklist tenant è deterministica e normalizzata rispetto a maiuscole, accenti e punteggiatura: genera flag `blocked_term:*` visibili al moderatore ma non pubblica, rifiuta o cancella automaticamente. Anche URL, possibili dati personali e pattern spam producono soltanto flag.\n\nLa moderazione AI è predisposta solo semanticamente in `tenant_feature_settings.config`, ma V1 la forza `false` e non effettua alcuna inference. Una futura implementazione dovrà passare dal Lepefy AI Gateway; la decisione umana resterà comunque separata.\n\nAlla consegna di un ordine eleggibile viene creato idempotentemente un `review_invite`; il caso ordine già `delivered` che diventa `paid` successivamente è coperto anche dal PATCH admin ordine. Default: invio dopo 24 ore, reminder dopo 7 giorni, scadenza dopo 30 giorni. `.github/workflows/review-invites.yml` richiama ogni 30 minuti `scripts/process-review-invites.mjs`, che seleziona gli inviti dovuti e chiama `/api/internal/review-invites` sul dominio canonico tenant. La route usa claim retry-safe, token hashato e webhook n8n `/webhook/review-invite`. `notifyN8n()` è trattato come booleano autorevole: `false` non imposta `sent_at`/`reminder_sent_at`, cancella il token creato per quel tentativo e lascia il lavoro ritentabile.\n\n`reviews`, `review_invites`, `review_invite_tokens` e `review_moderation_events` sono service-role-only con RLS forzata e nessuna policy browser diretta. `tenant_review_stats` aggrega esclusivamente recensioni `published`; la media pubblica può essere nascosta fino a `min_public_count` (default 3), mentre `/avis` mostra soltanto righe pubblicate con badge `Commande vérifiée`. L'historique autenticato `/orders` mostra una CTA per gli ordini delivered+paid ancora senza recensione. Una submission anticipata completa l'invito eventualmente esistente per evitare e-mail successive inutili.\n\nLa migration additiva `113_reviews_foundation.sql` deve essere applicata manualmente in Supabase prima dell'attivazione: Vercel non applica migration. Prima dello schema/setting, i resolver falliscono chiusi e il modulo resta invisibile/inattivo.\n\n---\n\n" + marker, 1)
          if '113_reviews_foundation.sql' not in text:
              text = text.replace('112_category_service_writes.sql\n104_customer_account_deletion.sql', '112_category_service_writes.sql\n113_reviews_foundation.sql\n104_customer_account_deletion.sql', 1)
          migration_note = "`113` introduce Reviews V1 verificato: entitlement/settings tenant, capability RBAC dedicate, recensioni service one-per-order paid+delivered, inviti token-hashati, moderazione umana obbligatoria con contenuto immutabile e audit append-only, blacklist deterministica, statistiche pubbliche sulle sole recensioni published e dispatcher retry-safe. L’AI moderation resta disabilitata in V1. La migration è additiva e richiede applicazione manuale in Supabase prima dell’attivazione del modulo.\n\n"
          if '`113` introduce Reviews V1 verificato' not in text:
              text = text.replace('Nala Analytics Dashboard V1 non richiede migration:', migration_note + 'Nala Analytics Dashboard V1 non richiede migration:', 1)
          text = text.replace('# Fine snapshot v6.55', '# Fine snapshot v6.56')
          text = text.replace('**Base audit:** `main + provider-neutral managed shipping tracking V1`', '**Base audit:** `main + verified service reviews V1`')
          p.write_text(text)
      - name: Commit normal staged delivery
        shell: bash
        run: |
          git config user.name "Lepefy Automation"
          git config user.email "automation@lepefy.invalid"
          git add -A
          git commit -m "stage(reviews): materialize verified reviews V1"
          git push origin HEAD:automation/reviews-v1-stage
