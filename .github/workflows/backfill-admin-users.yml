name: Backfill Admin Users (ADMIN_EMAILS → admin_users)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (nessuna scrittura su admin_users)'
        required: false
        default: true
        type: boolean

jobs:
  backfill-admin-users:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backfill admin_users
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/backfill-admin-users.mjs
